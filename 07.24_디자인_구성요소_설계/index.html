<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모아온 - 와이어프레임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo box"></div>
        <nav>
            <div class="nav-item box"></div>
            <div class="nav-item box"></div>
            <div class="nav-item box"></div>
            <div class="nav-item box"></div>
            <div class="nav-item box"></div>
        </nav>
        <div class="header-btn box"></div>
    </header>

    <main>
        <!-- Section 1: Hero -->
        <section id="hero">
            <div class="hero-left">
                <div class="text-line title-line box"></div>
                <div class="text-line box"></div>
                <div class="text-line box" style="width: 70%;"></div>
                <div class="text-line box" style="width: 50%; margin-bottom: 40px;"></div>
                <div class="btn-large box"></div>
            </div>
            <div class="hero-right">
                <div class="hero-img box"></div>
            </div>
        </section>

        <!-- Section 2: Problem -->
        <section id="problem" class="bg-gray">
            <div class="section-title box" style="width: 40%;"></div>
            <div class="grid-3">
                <div class="card">
                    <div class="img-box box"></div>
                    <div class="text-line box" style="width: 60%; margin: 0 auto;"></div>
                </div>
                <div class="card">
                    <div class="img-box box"></div>
                    <div class="text-line box" style="width: 60%; margin: 0 auto;"></div>
                </div>
                <div class="card">
                    <div class="img-box box"></div>
                    <div class="text-line box" style="width: 60%; margin: 0 auto;"></div>
                </div>
            </div>
        </section>

        <!-- Section 3: How to Use -->
        <section id="how-to-use">
            <div class="section-title box" style="width: 20%;"></div>
            <div class="grid-3 flex-align-start">
                <div class="step-col">
                    <div class="toggle-ui box"></div>
                    <div class="text-line box" style="width: 80%; margin: 0 auto;"></div>
                </div>
                <div class="step-col">
                    <div class="step-img box"></div>
                    <div class="text-line box" style="width: 80%; margin: 0 auto;"></div>
                </div>
                <div class="step-col">
                    <div class="step-img box"></div>
                    <div class="text-line box" style="width: 80%; margin: 0 auto;"></div>
                </div>
            </div>
        </section>

        <!-- Section 4: Products & Pricing -->
        <section id="products">
            <div class="grid-3">
                <div class="card product-card">
                    <div class="text-line box" style="width: 40%; margin-bottom: 20px;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                    <div class="text-line box" style="width: 70%; margin-bottom: 30px;"></div>
                    <div class="chart-box box"></div>
                </div>
                <div class="card product-card">
                    <div class="text-line box" style="width: 40%; margin-bottom: 20px;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                    <div class="text-line box" style="width: 70%; margin-bottom: 30px;"></div>
                    <div class="chart-box box"></div>
                </div>
                <div class="card product-card">
                    <div class="text-line box" style="width: 40%; margin-bottom: 20px;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                    <div class="text-line box" style="width: 70%; margin-bottom: 30px;"></div>
                    <div class="chart-box box"></div>
                </div>
            </div>
        </section>

        <!-- Section 5: Composition Example -->
        <section id="composition">
            <div class="wide-img box"></div>
            <div class="text-line box" style="width: 40%; margin-top: 15px; margin-left: 0;"></div>
        </section>

        <!-- Section 6: Testimonials -->
        <section id="testimonials">
            <div class="section-title box" style="width: 15%; margin-left: 0;"></div>
            <div class="grid-3">
                <div class="card review-card">
                    <div class="review-header">
                        <div class="avatar box"></div>
                        <div class="text-line box" style="width: 50%;"></div>
                    </div>
                    <div class="text-line box" style="width: 90%;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                </div>
                <div class="card review-card">
                    <div class="review-header">
                        <div class="avatar box"></div>
                        <div class="text-line box" style="width: 50%;"></div>
                    </div>
                    <div class="text-line box" style="width: 90%;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                </div>
                <div class="card review-card">
                    <div class="review-header">
                        <div class="avatar box"></div>
                        <div class="text-line box" style="width: 50%;"></div>
                    </div>
                    <div class="text-line box" style="width: 90%;"></div>
                    <div class="text-line box" style="width: 70%;"></div>
                </div>
            </div>
            <div class="dots-container">
                <div class="dot box"></div>
                <div class="dot box"></div>
                <div class="dot box"></div>
            </div>
        </section>

        <!-- Section 7: Bottom CTA -->
        <section id="bottom-cta" class="bg-gray">
            <div class="cta-layout">
                <div class="cta-left">
                    <div class="text-line title-line box" style="width: 80%;"></div>
                    <div class="text-line title-line box" style="width: 60%;"></div>
                </div>
                <div class="cta-right">
                    <div class="input-box box"></div>
                    <div class="input-box box"></div>
                    <div class="text-line box" style="width: 80%; height: 10px; margin-bottom: 20px;"></div>
                    <div class="btn-large box" style="width: 100%; border-radius: 25px;"></div>
                </div>
            </div>
        </section>

        <!-- Section 8: FAQ -->
        <section id="faq">
            <div class="section-title box" style="width: 10%; margin-left: 0;"></div>
            <div class="accordion box"></div>
            <div class="accordion box"></div>
            <div class="accordion box"></div>
            <div class="text-line box" style="width: 20%; margin: 40px auto 0;"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray">
        <div class="footer-layout">
            <div class="logo box"></div>
            <div class="footer-center">
                <div class="text-line box" style="width: 60%; margin-bottom: 10px;"></div>
                <div class="text-line box" style="width: 40%;"></div>
            </div>
            <div class="footer-right">
                <div class="square box"></div>
                <div class="square box"></div>
                <div class="square box"></div>
            </div>
        </div>
        <div class="footer-bottom box"></div>
    </footer>
</body>
</html>
